# RGB is unused. The custom keymap must omit all &rgb_ug bindings.
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_POINTING=y

# Stock debounce trial: stronger press filtering; release timing unchanged.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=10
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=15

# Batteryless USB-powered setup; BLE remains enabled for the split link.
CONFIG_ZMK_BATTERY_REPORTING=n
CONFIG_ZMK_SLEEP=n
