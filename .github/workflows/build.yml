name: Build ZMK firmware
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    # Enable only after config/halcyon_elora.keymap is ported and validated.
    # Otherwise ZMK falls back to the module's unwanted default number-row map.
    if: false
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
